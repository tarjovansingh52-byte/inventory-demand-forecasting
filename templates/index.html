<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Demand Forecasting System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <div class="dashboard-container">
      
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">📦</div>
                <h2>FORECAST PLATFORM</h2>
            </div>
            
<nav class="nav-menu">
    <a href="#" class="nav-link active" data-target="dashboard-section">Dashboard</a>
</nav>
        </aside>
        
        <main class="main-content">
            <header class="top-bar">
                <h1>Inventory Demand Forecasting</h1>
                <h4>Enterprise Machine Learning Demand Prediction Platform</h4>
            </header>

            <div class="content-grid">
                
                <div class="card form-card">
                    <h3>Predictive Parameters</h3>
                    <form id="forecasting-form">
                        <div class="form-grid">
                            <div class="input-group">
                                <label>Category</label>
                                <select id="category" required>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Clothing">Clothing</option>
                                    <option value="Groceries">Groceries</option>
                                    <option value="Toys">Toys</option>
                                    <option value="Furniture">Furniture</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label>Region</label>
                                <select id="region" required>
                                    <option value="North">North</option>
                                    <option value="South">South</option>
                                    <option value="East">East</option>
                                    <option value="West">West</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label>Inventory Level</label>
                                <input type="number" id="inventory_level" placeholder="eg.500" required>
                            </div>

                            <div class="input-group">
                                <label>Units Sold (Historical)</label>
                                <input type="number" id="units_sold" placeholder="eg.20" required>
                            </div>

                            <div class="input-group">
                                <label>Units Ordered</label>
                                <input type="number" id="units_ordered" placeholder="eg.30" required>
                            </div>

                            <div class="input-group">
                                <label>Price ($)</label>
                                <input type="number" step="0.01" id="price" placeholder="eg.250" required>
                            </div>

                            <div class="input-group">
                                <label>Discount (%)</label>
                                <input type="number" id="discount" placeholder="eg.5" required>
                            </div>

                            <div class="input-group">
                                <label>Competitor Price ($)</label>
                                <input type="number" step="0.01" id="competitor_pricing" placeholder="eg.180" required>
                            </div>

                            <div class="input-group">
                                <label>Weather Condition</label>
                                <select id="weather_condition" required>
                                    <option value="Sunny">Sunny</option>
                                    <option value="Rainy">Rainy</option>
                                    <option value="Snowy">Snowy</option>
                                    <option value="Cloudy">Cloudy</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label>Seasonality</label>
                                <select id="seasonality" required>
                                    <option value="Summer">Summer</option>
                                    <option value="Winter">Winter</option>
                                    <option value="Spring">Spring</option>
                                    <option value="Autumn">Autumn</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label>Active Promotion</label>
                                <select id="promotion" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label>Epidemic Situation</label>
                                <select id="epidemic" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn" id="predict-btn">Generate Demand Forecast</button>
                    </form>
                </div>

                <!-- Results Panel -->
                <div class="card result-card">
                    <h3>Forecast Results</h3>
                    <div class="result-display" id="result-display">
                        <div class="placeholder-text">DISPLAY RESULT</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
